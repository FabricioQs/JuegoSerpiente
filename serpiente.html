<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Juego de la Serpiente - Taller</title>
  <link rel="stylesheet" href="serpiente.css">
</head>
<body>
  <main class="contenedor-juego">
    <header class="encabezado-juego">
      <h1>🐍 SNAKE RETRO</h1>
      <p class="descripcion">
        Usa las flechas del teclado o los botones en pantalla para moverte. ¡Evita chocar contra los muros y crece!
      </p>
    </header>

    <section class="panel-info">
      <div class="tarjeta-info">
        <span>Puntaje</span>
        <strong id="puntaje">0</strong>
      </div>
      <div class="tarjeta-info">
        <span>Estado</span>
        <strong id="estado">Listo</strong>
      </div>
    </section>

    <!-- Canvas con sus dimensiones originales 600x600 -->
    <div class="contenedor-canvas">
      <canvas id="canvasJuego" width="600" height="600"></canvas>
    </div>

    <!-- Controles en pantalla -->
    <section class="controles">
      <button class="vacio" tabindex="-1">-</button>
      <button class="btn-direccion" onclick="cambiarDireccion('arriba')">⬆️</button>
      <button class="vacio" tabindex="-1">-</button>

      <button class="btn-direccion" onclick="cambiarDireccion('izquierda')">⬅️</button>
      <button class="btn-pausa" onclick="pausarJuego()">⏸️</button>
      <button class="btn-direccion" onclick="cambiarDireccion('derecha')">➡️</button>

      <button class="vacio" tabindex="-1">-</button>
      <button class="btn-direccion" onclick="cambiarDireccion('abajo')">⬇️</button>
      <button class="vacio" tabindex="-1">-</button>
    </section>

    <!-- Botones de Acción -->
    <section class="acciones">
      <button class="btn-principal" onclick="iniciarJuego()">Iniciar</button>
      <button class="secundario" onclick="reiniciarJuego()">Reiniciar</button>
    </section>

    <p id="mensaje" class="mensaje">Presiona iniciar para comenzar.</p>
  </main>

  <script src="serpiente.js"></script>
</body>
</html>
